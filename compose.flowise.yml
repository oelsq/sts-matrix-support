# Optional pilot: docker compose -f docker-compose.yml -f compose.flowise.yml --profile flowise up -d flowise
services:
  flowise-postgres:
    profiles: [flowise]
    image: postgres@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    env_file: ./runtime/flowise/database.env
    volumes:
      - flowise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flowise -d flowise"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  flowise-init:
    profiles: [flowise]
    image: flowiseai/flowise@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    user: root
    entrypoint: [sh, -c, "chown 1000:1000 /data"]
    network_mode: none
    volumes:
      - flowise_data:/data
    restart: "no"
  flowise:
    profiles: [flowise]
    # Flowise 3.1.4 is EOL; pilot only, loopback binding is intentional.
    image: flowiseai/flowise@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    ports:
      - "127.0.0.1:${FLOWISE_PORT:-13001}:3000"
    environment:
      PORT: "3000"
      # HTTP over a loopback/SSH tunnel only. Production forces Secure cookies.
      NODE_ENV: development
      SECURE_COOKIES: "false"
      DATABASE_PATH: /home/node/.flowise
      SECRETKEY_PATH: /home/node/.flowise
      APIKEY_PATH: /home/node/.flowise
      LOG_PATH: /home/node/.flowise/logs
      DISABLE_FLOWISE_TELEMETRY: "true"
      DISABLE_FILE_DOWNLOAD: "true"
      DATABASE_TYPE: postgres
      DATABASE_HOST: flowise-postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: flowise
      DATABASE_USER: flowise
    env_file: ./runtime/flowise/server.env
    volumes:
      - flowise_data:/home/node/.flowise
    depends_on:
      flowise-postgres:
        condition: service_healthy
      flowise-init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  flowise_data:
  flowise_postgres_data:
