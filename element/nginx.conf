server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /config { root /tmp/element-web-config; add_header Cache-Control "no-store"; }
    location /_matrix/ { proxy_pass http://homeserver:8008; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /_synapse/client/ { proxy_pass http://homeserver:8008; }
}
